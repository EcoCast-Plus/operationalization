name: Cleanup Old Data

on:
  # Run daily at 10:00 AM UTC (After predictions are done)
  schedule:
    - cron: '0 15 * * *'
  # Manual trigger
  workflow_dispatch:

jobs:
  delete-old-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to delete files
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        # We only need the R script, no need to download big data files
        sparse-checkout: |
          repo_cleanup/
        sparse-checkout-cone-mode: false

    - name: Install R
      uses: r-lib/actions/setup-r@v2

    - name: Install R packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: always
        packages: |
          any::httr
          any::jsonlite
          any::lubridate
          any::stringr

    - name: Run Cleanup Script
      shell: Rscript {0}
      run: source("repo_cleanup/delete_old_files.R")
