name: Update Website

on:
  # Triggered when model workflows complete
  workflow_run:
    workflows: ["CMEMS model workflow", "ROMS model workflow"]
    types:
      - completed
  # Manual trigger
  workflow_dispatch:

jobs:
  update-website:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      QUARTO_BUILD_DIR: website/docs
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          metadata/
          website/
          model_prediction/
        sparse-checkout-cone-mode: true

    - name: Install Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: 3.11

    - name: Install Copernicus Marine Toolbox
      shell: bash -el {0}
      run: |
        conda install -c conda-forge copernicusmarine
        conda install scipy

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.9.9

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.3'

    - name: Install R packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache-version: 4

    # [REMOVED] "Install Gulf App Dependencies" - Not needed for Iframe
    # [REMOVED] "Build Gulf Shinylive App" - Not needed for Iframe

    - name: Render Quarto Website
      run: quarto render website
      # This builds the HTML pages. The Gulf page will contain the iframe pointing 
      # to your live app on connect.fisheries.noaa.gov

    - name: Deploy to gh-pages branch
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ${{ env.QUARTO_BUILD_DIR }}
        publish_branch: gh-pages
