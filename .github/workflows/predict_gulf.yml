name: Predict Gulf of Mexico

on:
  workflow_run:
    workflows: ["Download CMEMS data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # JOB 1: INLA Models (Modern Environment)
  # ---------------------------------------------------------
  predict-inla:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container: ghcr.io/rocker-org/geospatial:4.4
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Configure R Repositories
      run: |
        echo 'options(repos = c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable"))' > ~/.Rprofile

    - name: Install INLA Dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true 
        cache-version: 3 
        install-quarto: false 
        packages: |
          any::dplyr
          any::terra
          any::sf
          any::stringr
          any::ggplot2
          any::tidyterra
          any::googleCloudStorageR
          any::inlabru@2.12.0
          any::INLA
          
    - name: Set up Google Cloud Auth
      env:
        GCS_SECRET: ${{ secrets.GCS_SA_KEY }}
      run: |
        printf "%s" "$GCS_SECRET" > gcs_auth.json
        echo "GCS_AUTH_FILE=$(pwd)/gcs_auth.json" >> $GITHUB_ENV

    - name: Run Leatherback Turtle Prediction (INLA)
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_leatherback_gulf.R

  # ---------------------------------------------------------
  # JOB 2: Tidymodels & XGBoost (Time Capsule Environment)
  # ---------------------------------------------------------
  predict-tidymodels:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Lock this to the exact R version from your local machine
    container: ghcr.io/rocker-org/geospatial:4.3.2
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Tidymodels Dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true 
        cache-version: 2 # Bump this to clear out the failed cache
        install-quarto: false 
        packages: |
          any::dplyr
          any::terra
          any::sf
          any::glue
          any::lubridate
          any::ncdf4
          any::raster
          any::ranger
          any::xgboost@1.7.7.1
          any::bundle@0.1.2
          any::parsnip@1.2.1
          any::workflows@1.1.4
          any::tidymodels@1.2.0
          any::recipes@1.3.1
          any::tidysdm@1.0.0
          any::stacks@1.0.5
          any::grec
          any::oce

    - name: Run General Species Predictions
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_gulf.R
      
    - name: Run Manta Ray Prediction
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_manta.R

  # ---------------------------------------------------------
  # JOB 3: Commit and Push (Runs after both are done)
  # ---------------------------------------------------------
  commit-results:
    needs: [predict-inla, predict-tidymodels]
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Commit and Push
      run: |
        git config --global --add safe.directory '*'
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        git config --global http.postBuffer 524288000
        git config --global http.maxRequestBuffer 100M
        git config --global core.compression 0
        
        git add model_prediction/gulf/predictions/*.tif || echo "No TIFs"
        git add model_prediction/gulf/predictions/*.png || echo "No PNGs"
        
        git pull origin main --rebase --autostash
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Gulf & Leatherback Predictions [$(date +'%Y-%m-%d')]"
          git push origin main
        fi
