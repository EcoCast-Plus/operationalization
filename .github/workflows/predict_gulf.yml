name: Predict Gulf of Mexico

on:
  workflow_run:
    workflows: ["Download CMEMS data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # JOB 1: Tidymodels & XGBoost (Time Capsule Environment)
  # (Moved to the top logically since it generates the env data)
  # ---------------------------------------------------------
  predict-tidymodels:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container: ghcr.io/rocker-org/geospatial:4.3.2
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Tidymodels Dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true 
        cache-version: 2
        install-quarto: false 
        packages: |
          any::dplyr
          any::terra
          any::sf
          any::glue
          any::lubridate
          any::ncdf4
          any::raster
          any::ranger
          any::xgboost@1.7.7.1
          any::bundle@0.1.2
          any::parsnip@1.2.1
          any::workflows@1.1.4
          any::tidymodels@1.2.0
          any::recipes@1.3.1
          any::tidysdm@1.0.0
          any::stacks@1.0.5
          any::grec
          any::oce

    - name: Run General Species Predictions
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_gulf.R
      
    - name: Run Manta Ray Prediction
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_manta.R

    - name: Upload Tidymodels Predictions & Env Layers
      uses: actions/upload-artifact@v4
      with:
        name: tidymodels-predictions
        path: model_prediction/gulf/predictions/
        retention-days: 1


  # ---------------------------------------------------------
  # JOB 2: Leatherback (Marginal Effects Lookup — no INLA)
  # ---------------------------------------------------------
  predict-leatherback:
    needs: [predict-tidymodels] # Waits for Job 1 to finish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: ghcr.io/rocker-org/geospatial:4.4

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    # ---> THIS IS THE MISSING LINK <---
    - name: Download Environmental Layers from Tidymodels Job
      uses: actions/download-artifact@v4
      with:
        name: tidymodels-predictions
        path: model_prediction/gulf/predictions/

    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true
        cache-version: 1
        install-quarto: false
        packages: |
          any::dplyr
          any::purrr
          any::terra
          any::sf
          any::stringr
          any::glue
          any::ggplot2
          any::tidyterra

    - name: Run Leatherback Turtle Prediction
      continue-on-error: true        
      run: Rscript model_prediction/R/predict_leatherback_gulf.R

    - name: Upload Leatherback Predictions
      uses: actions/upload-artifact@v4
      continue-on-error: true        
      with:
        name: inla-predictions
        path: model_prediction/gulf/predictions/
        retention-days: 1


  # ---------------------------------------------------------
  # JOB 3: Commit and Push (Runs after both are done)
  # ---------------------------------------------------------
  commit-results:
    needs: [predict-leatherback, predict-tidymodels]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }} 
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Download INLA Predictions
      uses: actions/download-artifact@v4
      continue-on-error: true 
      with:
        name: inla-predictions
        path: model_prediction/gulf/predictions/

    - name: Download Tidymodels Predictions
      uses: actions/download-artifact@v4
      continue-on-error: true 
      with:
        name: tidymodels-predictions
        path: model_prediction/gulf/predictions/
        
    - name: Commit and Push
      run: |
        git config --global --add safe.directory '*'
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        git config --global http.postBuffer 524288000
        git config --global http.maxRequestBuffer 100M
        git config --global core.compression 0
        
        git add model_prediction/gulf/predictions/*.tif || echo "No TIFs"
        git add model_prediction/gulf/predictions/*.png || echo "No PNGs"
        
        git pull origin main --rebase --autostash
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Gulf & Leatherback Predictions [$(date +'%Y-%m-%d')]"
          git push origin main
        fi
