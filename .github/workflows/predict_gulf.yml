name: Predict Gulf of Mexico

on:
  workflow_run:
    workflows: ["Download CMEMS data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict-gulf:
    # Only run if the download was successful OR if triggered manually
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.3'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libnetcdf-dev libudunits2-dev libharfbuzz-dev libfribidi-dev

    - name: Install Bioconductor & INLA Dependencies
      # These specific libraries are required before INLA can load
      run: |
        Rscript -e "if (!require('BiocManager', quietly = TRUE)) install.packages('BiocManager')"
        Rscript -e "BiocManager::install(c('graph', 'Rgraphviz'), update = FALSE, ask = FALSE)"

    - name: Configure R Repositories
      # This globally registers the INLA server so pak knows where to find it
      run: |
        echo 'options(repos = c(CRAN = "https://cloud.r-project.org", INLA = "https://inla.r-inla-download.org/R/stable"))' > ~/.Rprofile

    - name: Install R Dependencies with Version Locking
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: always
        cache-version: 14 # Bumped to 13 to clear the failed resolution cache
        install-quarto: false # ADDED: Prevents the 502 Bad Gateway download error
        packages: |
          any::dplyr
          any::terra
          any::sf
          any::ggplot2
          any::tidyterra
          any::remotes
          any::googleCloudStorageR
          any::stringr
          any::fmesher
          any::BiocManager
          any::xgboost@1.7.7.1
          any::stacks@1.0.5
          any::tidysdm@1.0.0
          any::bundle@0.1.2
          any::themis@1.0.3
          any::sn
          any::ranger
          any::mgcv
          any::oce
          any::tidymodels@1.2.0
          any::workflows
          any::parsnip
          any::glue
          any::lubridate
          any::grec
          any::ncdf4
          any::inlabru@2.12.0
          any::INLA
          any::rnaturalearth      # <-- ADDED
          any::rnaturalearthdata  # <-- ADDED (Contains the medium-res coastline data)

    - name: Run General Species Predictions
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_gulf.R
      
    - name: Run Manta Ray Prediction
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_manta.R

    - name: Set up Google Cloud Auth
      # This pulls your GitHub Secret and temporarily writes it to the runner so R can use it
      run: |
        echo '${{ secrets.GCS_SA_KEY }}' > gcs_auth.json
        echo "GCS_AUTH_FILE=$(pwd)/gcs_auth.json" >> $GITHUB_ENV

    - name: Run Leatherback Turtle Prediction
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_leatherback_gulf.R

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        # 1. Stage the new predictions first
        git add model_prediction/gulf/predictions/*.tif || echo "No TIFs"
        git add model_prediction/gulf/predictions/*.png || echo "No PNGs"
        
        # 2. Pull with rebase and autostash
        # This handles the "unstaged changes" error by temporarily hiding your new files
        git pull origin main --rebase --autostash
        
        # 3. Finalize and push
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Gulf & Leatherback Predictions [$(date +'%Y-%m-%d')]"
          git push origin main
        fi
