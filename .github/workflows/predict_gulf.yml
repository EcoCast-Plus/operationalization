name: Predict Gulf of Mexico

on:
  workflow_run:
    workflows: ["Download CMEMS data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict-gulf:
    # Only run if the download was successful OR if triggered manually
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.3'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libnetcdf-dev libudunits2-dev libharfbuzz-dev libfribidi-dev

    - name: Install Bioconductor & INLA Dependencies
      # These specific libraries are required before INLA can load
      run: |
        Rscript -e "if (!require('BiocManager', quietly = TRUE)) install.packages('BiocManager')"
        Rscript -e "BiocManager::install(c('graph', 'Rgraphviz'), update = FALSE, ask = FALSE)"

    - name: Install R Dependencies with Version Locking
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: always
        cache-version: 8 # Bumped to install new dependencies
        packages: |
          any::dplyr
          any::terra
          any::sf
          any::ggplot2
          any::tidyterra
          any::remotes
          any::googledrive
          any::stringr
          any::fmesher
          any::BiocManager
          any::xgboost@1.7.8.1
          any::stacks
          any::tidysdm
          any::bundle
          any::sn
        extra-repos: |
          INLA=https://inla.r-inla-download.org/R/stable

    - name: Force Specific INLA and inlabru Versions
      run: |
        Rscript -e "if (!require('inlabru') || packageVersion('inlabru') != '2.12.0') remotes::install_version('inlabru', version='2.12.0', repos='https://cloud.r-project.org')"
        Rscript -e "if (!require('INLA')) install.packages('INLA', repos='https://inla.r-inla-download.org/R/stable', dep=TRUE)"

    - name: Run General Species Predictions
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_gulf.R

    - name: Run Leatherback Turtle Prediction
      continue-on-error: true 
      run: Rscript model_prediction/R/predict_leatherback_gulf.R

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git pull origin main --rebase
        
        # Use 'git add' with a check to avoid "pathspec did not match" errors
        # This allows the workflow to push successfully even if only some files were created
        git add model_prediction/gulf/predictions/*.tif || echo "No TIFs found"
        git add model_prediction/gulf/predictions/*.png || echo "No PNGs found"
        
        if git diff --staged --quiet; then
          echo "No new predictions to commit."
        else
          git commit -m "Update Gulf & Leatherback Predictions [$(date +'%Y-%m-%d')]"
          git push origin main
        fi
