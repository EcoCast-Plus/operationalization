project:
  type: website
  output-dir: docs

website:
  title: "EcoCast Plus"
  search: true
  repo-url: https://github.com/EcoCast-Plus/operationalization
  repo-subdir: website

  # TOP NAVIGATION BAR WITH DROPDOWNS
  navbar:
    background: primary
    logo: "https://www.noaa.gov/sites/default/files/2022-03/noaa_emblem_logo-2022.png"
    left:
      - href: index.qmd
        text: Home
      
      # West Coast Dropdown
      - text: "West Coast"
        menu:
          - text: "Leatherback Explorer"
            href: west_coast/leatherback.qmd
          - text: "LBST & CMEMS Data"
            href: west_coast/lbst_cmems.qmd

      # Gulf Dropdown
      - text: "Gulf of America"
        menu:
          - text: "Pelagic Longline Explorer"
            href: gulf/pelagic_longline.qmd

      # Placeholders (No dropdown yet, just single links or disabled)
      - text: "Hawaii"
        href: hawaii/placeholder.qmd
      - text: "South Atlantic"
        href: south_atlantic/placeholder.qmd

  # Sidebar removed entirely to allow full-width centered design
  page-navigation: true

format:
  html:
    theme: zephyr
    toc: false      # Disable "On this page" globally (optional, nice for maps)
    css: styles.css
    mainfont: "Segoe UI, sans-serif"

execute:
  warning: false
  message: false
